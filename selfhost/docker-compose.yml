# gotify selfhost. alert hub — this one DOES run on the vps (tiny, ~20mb).
# laptop copy for experiments. manual runs, no autostart anywhere.
# usage: docker compose -f selfhost/docker-compose.yml --env-file selfhost/.env up -d

services:
  gotify:
    image: gotify/gotify:2.15
    container_name: gotify
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - GOTIFY_DEFAULTUSER_NAME=${ADMIN_USER:-admin}
      - GOTIFY_DEFAULTUSER_PASS=${ADMIN_PASSWORD:-changeme-long}
      - GOTIFY_SERVER_PORT=80
      - TZ=Europe/Moscow
    volumes:
      - gotify-data:/app/data
    ports:
      - "${GOTIFY_PORT:-8087}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gotify-data:
    name: gotify-data
